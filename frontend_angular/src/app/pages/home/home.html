<div class="page">

  <!-- Hero -->
  <section class="hero">

    <p class="hero-eyebrow">
      LIEFERDIENST
    </p>

    <h1 class="hero-title">
      Weniger kochen.<br>
      Mehr genießen.
    </h1>

    <p class="hero-subtitle">
      Kuratierte Gerichte lokaler Anbieter,
      geliefert in Minuten statt Stunden.
    </p>

  </section>

  <h2>TEST</h2>

  <p>Produkte: {{ products.length }}</p>
  <p>Gefiltert: {{ filteredProducts.length }}</p>
  <p>Anbieter: {{ vendors.length }}</p>

  <!-- Anbieter -->
 <div class="vendor-scroll">

  <button
    class="vendor-chip"
    [class.vendor-chip-active]="selectedVendor === null"
    (click)="filterByVendor(null)">

    Alle

  </button>

  <button
    *ngFor="let vendor of vendors"
    class="vendor-chip"
    [class.vendor-chip-active]="selectedVendor === vendor.id"
    (click)="filterByVendor(vendor.id)">

    {{ vendor.name }}

  </button>

</div>

  <!-- Kategorien -->
  <div class="cat-row">

    <button class="cat-tab">
      Alle
    </button>

    <button
      *ngFor="let category of categories"
      class="cat-tab">

      {{ category }}

    </button>

  </div>

  <!-- Produkte -->
  <div class="grid">

    <app-product-card
      *ngFor="let product of filteredProducts"
      [product]="product">
    </app-product-card>

  </div>

</div>
